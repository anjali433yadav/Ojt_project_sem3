
services:
  db:
    image: postgres:17
    container_name: phishing-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: phishing_simulation
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d phishing_simulation"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
